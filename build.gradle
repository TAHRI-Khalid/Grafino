plugins {
    id 'java'
    id 'application'
}

group = 'tk.tahri'
version = project.findProperty('appVersion') ?: '1.1.0'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 27
}

application {
    mainModule = 'tk.tahri.grafino'
    mainClass = 'tk.tahri.grafino.App'
}

// Détection automatique de la plateforme (Linux, Windows, macOS, x86_64 et ARM64) pour les artefacts JavaFX
def osName = System.getProperty("os.name").toLowerCase()
def osArch = System.getProperty("os.arch").toLowerCase()

def osClassifier = {
    if (osName.contains("win")) {
        return "win"
    } else if (osName.contains("mac")) {
        return (osArch == "aarch64" || osArch == "arm64") ? "mac-aarch64" : "mac"
    } else {
        return (osArch == "aarch64" || osArch == "arm64") ? "linux-aarch64" : "linux"
    }
}()

def javafxVersion = project.findProperty('javafx.version') ?: '27'
def junitVersion = '5.13.4'
def junitPlatformVersion = '1.13.4'

dependencies {
    implementation "org.openjfx:javafx-base:${javafxVersion}:${osClassifier}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${osClassifier}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${osClassifier}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
}

jar {
    manifest {
        attributes(
            'Main-Class': 'tk.tahri.grafino.Main',
            'Implementation-Title': 'Grafino',
            'Implementation-Version': project.version
        )
    }
}

tasks.register('fatJar', Jar) {
    archiveBaseName = 'Grafino'
    archiveClassifier = 'all'
    manifest {
        attributes(
            'Main-Class': 'tk.tahri.grafino.Main',
            'Implementation-Title': 'Grafino',
            'Implementation-Version': project.version
        )
    }
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'prism.order', 'sw'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
