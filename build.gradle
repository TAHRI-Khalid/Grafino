plugins {
    id 'java'
    id 'application'
}

group = 'tk.tahri'
version = '1.0-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

application {
    mainModule = 'tk.tahri.grafino'
    mainClass = 'tk.tahri.grafino.App'
}

// Détection automatique de la plateforme (Linux, Windows, macOS)
def osName = System.getProperty("os.name").toLowerCase()
def osClassifier = osName.contains("win") ? "win" : (osName.contains("mac") ? "mac" : "linux")

def javafxVersion = project.findProperty('javafx.version') ?: '27'
def junitVersion = '5.13.4'
def junitPlatformVersion = '1.13.4'

dependencies {
    implementation "org.openjfx:javafx-base:${javafxVersion}:${osClassifier}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${osClassifier}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${osClassifier}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
}

test {
    useJUnitPlatform()
}