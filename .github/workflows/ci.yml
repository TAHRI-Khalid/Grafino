name: Continuous Integration

on:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '27'
          cache: gradle

      - name: Test et vérification de la compilation (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew check
          ./gradlew fatJar -x test

      - name: Test et vérification de la compilation (Windows)
        if: runner.os == 'Windows'
        run: |
          .\gradlew.bat check
          .\gradlew.bat fatJar -x test
